<!DOCTYPE html>
<html lang="en">
<head>
  {% block title %}
    <title>Taxi Service</title>
  {% endblock %}
</head>

<body>

  <div>

    <div>

      <ul class="sidebar-nav">

        {% if user.is_authenticated %}

          <li>
            <a href="{{ user.driver.get_absolute_url }}">
              {{ user.username }}
            </a>
          </li>

          <li>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit">
                Logout
              </button>
            </form>
          </li>

        {% else %}

          <li>
            <a href="{% url 'login' %}?next={{ request.path }}">
              Login
            </a>
          </li>

        {% endif %}

        <hr>

        <li>
          <a href="{% url 'taxi:index' %}">
            Home
          </a>
        </li>

        <li>
          <a href="{% url 'taxi:manufacturer-list' %}">
            Manufacturers
          </a>
        </li>

        <li>
          <a href="{% url 'taxi:car-list' %}">
            Cars
          </a>
        </li>

        <li>
          <a href="{% url 'taxi:driver-list' %}">
            Drivers
          </a>
        </li>

      </ul>

    </div>

    <div>

      {% block content %}
      {% endblock %}

    </div>

  </div>

</body>
</html>
