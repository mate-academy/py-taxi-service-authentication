<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">
      User:
      <a href="{% url 'taxi:driver-detail' pk=user.pk %}">
        {{ user.get_username }}
      </a>
    </li>
    <li class="list-group-item">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-link p-0" type="submit">Logout</button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item">
      <a href="{% url 'login' %}?next={{ request.path }}">Login</a>
    </li>
  {% endif %}
  <li class="list-group-item"><a href="{% url 'taxi:index' %}">Home page</a></li>
  <li class="list-group-item">
    <a href="{% url 'taxi:manufacturer-list' %}">Manufacturers</a>
  </li>
  <li class="list-group-item"><a href="{% url 'taxi:car-list' %}">Cars</a></li>
  <li class="list-group-item">
    <a href="{% url 'taxi:driver-list' %}">Drivers</a>
  </li>
</ul>
