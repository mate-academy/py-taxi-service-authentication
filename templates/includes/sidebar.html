<ul class="sidebar-nav">
  {% if user.is_authenticated %}
    <li>
      <h5>User: <a href={% url 'taxi:driver-detail' request.user.id %}>{{ user.username }}</a></h5>
      <form method="post" action="{% url 'logout' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-link p-0 m-0 align-baseline" style="text-decoration: none;">
          Logout
        </button>
      </form>
    </li>
  {% else %}
    <a href="{% url 'login' %}">Login</a>
  {% endif %}
  <li><a href="{% url "taxi:index" %}">Home page</a></li>
  <li><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
