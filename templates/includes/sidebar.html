{% if user.is_authenticated %}
  <div>
    <p>User: <a href="{% url 'taxi:driver-detail' pk=user.id %}">{{ user.username }}</a></p>

    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" style="background: none; border: none; padding: 0; color: #007bff; cursor: pointer; text-decoration: underline;">
          Logout
      </button>
    </form>

  </div>
  <hr>
{% else %}
  <div>
    <a href="{% url 'login' %}?next={{ request.path }}">Login</a>
  </div>
  <hr>
{% endif %}

<ul class="sidebar-nav">
  <li><a href="{% url 'taxi:index' %}">Home page</a></li>
  <li><a href="{% url 'taxi:manufacturer-list' %}">Manufacturers</a></li>
  <li><a href="{% url 'taxi:car-list' %}">Cars</a></li>
  <li><a href="{% url 'taxi:driver-list' %}">Drivers</a></li>
</ul>
