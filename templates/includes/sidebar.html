{% if user.is_authenticated %}
    <ul>
    <li>
      <a href="{% url 'taxi:driver-detail' user.id %}">
        {{ user.username }}
      </a>
    </li>
    <li>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" style="background:none;border:none;padding:0;color:blue;cursor:pointer;">Logout</button>
      </form>
    </li>
    </ul>
  {% else %}
    <li><a href="{% url 'login' %}">Login</a></li>
  {% endif %}
