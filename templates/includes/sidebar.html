<div class="sidebar-auth">
    {% if user.is_authenticated %}
        <p class="mb-2">User:
            <a href="{% url 'taxi:driver-detail' user.taxi_profile.id %}">
                <strong>{{ user.username }}</strong>
            </a>
        </p>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm btn-block">Log out</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm btn-block">Log in</a>
    {% endif %}
</div>
