{% if user.is_authenticated %}
  <p>User: <a href="{% url 'taxi:driver-detail' pk=user.id %}">{{ user.username }}</a></p>
  <form name="Logout" action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <input type="submit" value="Logout" class="btn btn-link">
  </form>
{% else %}
  <a href="{% url 'login' %}">Login</a>
{% endif %}

  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
