<ul class="sidebar-nav">
  {% if user.is_authenticated %}
    {% if user_driver %}
      <li><a href="{% url 'taxi:driver-detail' user_driver.pk %}">{{ user.username }}</a></li>
    {% else %}
      <li>{{ user.username }}</li>
    {% endif %}
  <li>
    <form action="{% url 'logout' %}" method="post" style="display:inline;">
      {% csrf_token %}
      <button type="submit" class="btn-plain">Logout</button>
    </form>
  </li>
  {% else %}
  <li><a href="{% url 'login' %}">Login</a></li>
  {% endif %}
  <br>
  <li><a href="{% url "taxi:index" %}">Home page</a></li>
  <li><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
