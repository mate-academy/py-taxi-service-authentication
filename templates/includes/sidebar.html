<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item list-group-item-info">User: <a href="{% url "taxi:driver-detail" pk=user.id %}">{{ user.get_username }}</a></li>
    <li class="list-group-item list-group-item-danger">
      <form id="logout-form" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-link">Logout</button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item list-group-item-info"><a href="{% url 'login' %}?next={{ request.path }}">Login</a></li>
  {% endif %}
  <li class="list-group-item"><a href="{% url "taxi:index" %}">Home page</a></li>
  <li class="list-group-item"><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li class="list-group-item"><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li class="list-group-item"><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
