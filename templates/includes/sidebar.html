<ul class="sidebar-nav">
  {% if user.is_authenticated %}
    <li>
      User: <a href="{% url 'taxi:driver-detail' pk=user.id %}">
      {{ user.username }}</a>
    </li>
    <li>
      <form method="post" action="{% url 'logout' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit"
                style="background: none; border: none; color: #007bff; cursor: pointer; padding: 0; text-decoration: underline;">
          Logout
        </button>
      </form>
    </li>
    <br>
  {% else %}
    <li><a href="{% url 'login' %}">Login</a></li>
  {% endif %}
  <li><a href="{% url "taxi:index" %}">Home page</a></li>
  <li><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
