<ul class="sidebar-nav">
  {% if user.is_authenticated %}
    <li>
      <a href="{% url 'taxi:driver-detail' pk=user.id %}">User: {{ user.username }}</a>
    </li>
    <li>
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-link nav-link" style="display: inline; padding: 0; border: none; background: none; color: #007bff; text-decoration: underline; cursor: pointer;">
          Logout
        </button>
      </form>
    </li>
  	{% else %}
    <li>
      <a href="{% url 'login' %}">Login</a>
    </li>
  {% endif %}
  <hr>
  <li><a href="{% url "taxi:index" %}">Home page</a></li>
  <li><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
