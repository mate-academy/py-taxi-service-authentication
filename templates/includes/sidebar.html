<ul class="sidebar-nav">
  <li><a href="{% url "taxi:index" %}">Home page</a></li>
  <li><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>

  {% if user.is_authenticated %}
    <li>
      User: <a href="{% url "taxi:driver-detail" user.id %}">{{ user.username }}</a>
    </li>
    <li>
      <form action="{% url "logout" %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit" style="background:none;border:none;color:blue;cursor:pointer;padding:0;">Logout</button>
      </form>
    </li>
  {% else %}
    <li><a href="{% url "login" %}">Login</a></li>
  {% endif %}
</ul>
