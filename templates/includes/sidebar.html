<div class="list-group list-group-flush mb-4">
  {% if user.is_authenticated %}
    <!-- Профіль користувача -->
    <a href="{% url 'taxi:driver-detail' user.pk %}" class="list-group-item list-group-item-action d-flex align-items-center fw-bold text-primary">
      <i class="bi bi-person-circle me-2"></i> {{ user.username }}
    </a>

    <!-- Кнопка виходу (POST-форма зі стилями посилання) -->
    <div class="list-group-item">
      <form action="{% url 'logout' %}" method="post" class="m-0 p-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-link p-0 text-danger text-decoration-none border-0 bg-transparent w-100 text-start">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </form>
    </div>
  {% else %}
    <!-- Вхід у систему -->
    <a href="{% url 'login' %}" class="list-group-item list-group-item-action text-success fw-bold">
      <i class="bi bi-box-arrow-in-right me-2"></i> Login
    </a>
  {% endif %}

  <!-- Основні розділи навігації -->
  <a href="{% url 'taxi:index' %}" class="list-group-item list-group-item-action">
    <i class="bi bi-house-door me-2"></i> Home page
  </a>
  <a href="{% url 'taxi:manufacturer-list' %}" class="list-group-item list-group-item-action">
    <i class="bi bi-building me-2"></i> Manufacturers
  </a>
  <a href="{% url 'taxi:car-list' %}" class="list-group-item list-group-item-action">
    <i class="bi bi-car-front me-2"></i> Cars
  </a>
  <a href="{% url 'taxi:driver-list' %}" class="list-group-item list-group-item-action">
    <i class="bi bi-people me-2"></i> Drivers
  </a>
</div>
