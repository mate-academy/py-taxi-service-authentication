<ul class="sidebar-nav">
  {% if user.is_authenticated %}
    <li style="list-style: none">
      <a href="{% url 'taxi:driver-detail' user.id %}">{{ user.username }}</a>
    </li>
  {% else %}
    <li style="list-style: none">{{ user.username }}</li>
  {% endif %}
  
  {% if user.is_authenticated %}
    <form action="{% url 'logout' %}" method="post" style="display: inline;">
      {% csrf_token %}
      <button type="submit" class="your-button-style-here">Logout</button>
    </form>
  {% else %}
    <li style="list-style: none">
      <a href="{% url 'login' %}" class="your-button-style-here">Login</a>
    </li>
  {% endif %}

  <br>
  <li><a href="{% url "taxi:index" %}">Home page</a></li>
  <li><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
