<div class="user-info">
  {% if user.is_authenticated %}
    <p>
      Logged in as:
      <a href="{% url 'taxi:driver-detail' user.id %}">
        {{ user.username }}
      </a>
    </p>
    <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
  {% else %}
    <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Login</a>
  {% endif %}
</div>

<hr>
