<ul class="sidebar-nav">
  {% if user.is_authenticated %}
    <li style="list-style-type: none">User: <a href="{% url "taxi:driver-detail" pk=request.user.id %}"> {{ user.username }}</a></li>
    <li style="list-style-type: none">
      <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Logout</button>

    </li>
  {% else %}
    <li style="list-style-type: none"><a href="{% url 'login' %}">Login</a></li>
  {% endif %}

  <br>
  <li><a href="{% url "taxi:index" %}">Home page</a></li>
  <li><a href="{% url "taxi:manufacturer-list" %}">Manufacturers</a></li>
  <li><a href="{% url "taxi:car-list" %}">Cars</a></li>
  <li><a href="{% url "taxi:driver-list" %}">Drivers</a></li>
</ul>
