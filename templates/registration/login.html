{% extends "base.html" %}

{% block content %}
  <h1>Log in</h1>
  {% if form.errors %}
    <p class="text-danger" role="alert">Your username and password did not match. Please try again.</p>
  {% endif %}
  {% if next %}
    <p>Please log in to access this page.</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
{% endblock %}
