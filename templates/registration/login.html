{% extends "base.html" %}

{% block content %}
  <h2>Login</h2>

  {% if form.errors %}
    <p style="color: red;">Invalid username or password.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Login">
  </form>
{% endblock %}
