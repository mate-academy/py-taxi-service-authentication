{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

<form action="{% url 'login' %}" method="post">
  {% csrf_token %}
  
  {{ form.as_p }}

  <input type="submit" value="Submit">
  <input type="hidden" name="next" value="{{ next }}">
</form>

{% if form.errors %}
<hr>
<p style="color: red">Invalid username or password</p>
<hr>
{% endif %}

{% endblock %}
