{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1 class="mt-5">Login</h1>
  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">Username:</label>
      <input
        type="text"
        name="username"
        class="form-control"
        id="id_username"
        required
      />
    </div>
    <div class="form-group">
      <label for="id_password">Password:</label>
      <input
        type="password"
        name="password"
        class="form-control"
        id="id_password"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</div>
{% endblock %}
