{% extends "base.html" %}

{% block content %}
  <h1>Login</h1>

  {% if form.errors %}
    <p style="color: red;">Invalid username or password</p>
  {% endif %}

  {% if next %}
    <p>Please login to see this page.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="submit" value="Login">
  </form>
{% endblock %}
