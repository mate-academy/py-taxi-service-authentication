{% extends "base.html" %}

{% block content %}
  <h1>Login</h1>

  {% if form.errors %}
    <p style="color: red;">
      Invalid username or password. Try one more.
    </p>
  {% endif %}

  <form action="{% url "login" %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Login</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}
