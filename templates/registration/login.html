{% extends "base.html" %}

{% block content %}
  <h1>LOG IN</h1>
  {% if form.errors %}
    <p style="">Invalid credentials</p>
  {% endif %}
  <form action="{% url 'login' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
     <button type="submit" class="btn btn-primary mb-2" value="Submit">Log in</button>
  </form>
{% endblock %}
