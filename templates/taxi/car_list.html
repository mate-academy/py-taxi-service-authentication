{% extends "base.html" %}

{% block content %}
<h2>Car list</h2>

{% if object_list %}
  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>

    <tbody>
      {% for car in object_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' car.id %}">
              {{ car.id }}
            </a>
          </td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>There are no cars in taxi</p>
{% endif %}

{% endblock %}
