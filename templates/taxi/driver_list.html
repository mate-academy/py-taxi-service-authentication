{% extends "base.html" %}
{% block content %}
  <h1>Driver List</h1>
  <ul>
    {% for driver in driver_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' pk=driver.id %}">{{ driver.username }}</a>
        {% if driver.id == user.id %}
          (Me)
        {% endif %}
      </li>
    {% empty %}
      <li>There are no drivers in the service.</li>
    {% endfor %}
  </ul>
{% endblock %}
