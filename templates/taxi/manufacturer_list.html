{% extends "base.html" %}

{% block content %}
<h2>Manufacturer list</h2>

{% if object_list %}
  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Country</th>
      </tr>
    </thead>

    <tbody>
      {% for manufacturer in object_list %}
        <tr>
          <td>{{ manufacturer.id }}</td>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>No manufacturers available.</p>
{% endif %}

{% endblock %}
